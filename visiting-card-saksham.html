<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visiting Card – Saksham Gupta | Shucon MedAI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #e8eaed;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 64px 24px;
    font-family: 'Inter', sans-serif;
  }

  .label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #9ca3af;
    margin-bottom: 10px;
    text-align: center;
  }

  /* ── Card shell ── */
  .card {
    width: 356px;
    height: 204px;
    border-radius: 8px;
    box-shadow:
      0 1px 3px rgba(0,0,0,.06),
      0 12px 32px rgba(0,0,0,.10);
    position: relative;
    overflow: hidden;
  }

  /* ══════════════════════════════
     FRONT
  ══════════════════════════════ */
  .front {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 26px 20px;
  }

  /* Single hair-line accent at top */
  .front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: #1a1a2e;
  }

  .front-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .front-logo img {
    height: 39px;
    width: auto;
    display: block;
    object-fit: contain;
  }

  .front-company {
    font-size: 8.5px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #6b7280;
  }

  .front-qr img {
    width: 40px;
    height: 40px;
    display: block;
    object-fit: contain;
  }

  /* Name + titles block */
  .front-mid {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 0 6px;
  }

  .front-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 500;
    color: #0f172a;
    letter-spacing: 0.01em;
    line-height: 1.1;
  }

  .front-ceo {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #0f172a;
    margin-top: 5px;
  }

  .front-rule {
    width: 20px;
    height: 1px;
    background: #cbd5e1;
    margin: 6px 0;
  }

  .front-titles {
    font-size: 8.5px;
    font-weight: 400;
    color: #6d7581;
    letter-spacing: 0.02em;
    line-height: 1.6;
  }

  /* Bottom contact row */
  .front-bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .front-contact {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 8px;
    color: #4b5563;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .contact-row svg {
    width: 8px; height: 8px;
    flex-shrink: 0;
    opacity: 0.5;
  }

  .front-web {
    font-size: 8px;
    font-weight: 500;
    color: #79808b;
    letter-spacing: 0.08em;
    text-align: right;
    text-transform: lowercase;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .front-web svg {
    width: 8px; height: 8px;
    flex-shrink: 0;
    opacity: 0.6;
  }

  /* ══════════════════════════════
     BACK
  ══════════════════════════════ */
  .back {
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
  }

  /* Top hairline to match front */
  .back::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: #1a1a2e;
  }

  .back-inner {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .back-logo img {
    height: 39px;
    width: auto;
    object-fit: contain;
    margin-bottom: 12px;
  }

  .back-rule {
    width: 28px;
    height: 1px;
    background: #e2e8f0;
    margin-bottom: 12px;
  }

  .back-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #4b5563;
    text-align: center;
    line-height: 1.4;
    margin-bottom: 6px;
  }

  .back-subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 8px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #94a3b8;
    text-align: center;
    line-height: 1.5;
    margin-bottom: 18px;
  }

  .back-groups {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 18px;
  }

  .back-pill {
    font-size: 8px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #6b7280;
    border: 0.5px solid #e5e7eb;
    border-radius: 2px;
    padding: 3px 9px;
    text-align: center;
    line-height: 1.4;
  }

  .back-web {
    font-size: 8px;
    font-weight: 500;
    color: #9ca3af;
    letter-spacing: 0.12em;
    text-transform: lowercase;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .back-web svg {
    width: 8px; height: 8px;
    flex-shrink: 0;
    opacity: 0.6;
  }

  /* ── Print helpers ── */
  @media print {
    body { background: white; gap: 10mm; padding: 10mm; }
    .card { box-shadow: none; border: 0.25pt solid #d1d5db; }
    .label { display: none; }
  }
</style>
</head>
<body>

<!-- ── FRONT ── -->
<div class="label">Front</div>
<div class="card front">

  <div class="front-top">
    <div class="front-logo">
      <img src="images/logo-bg.png" alt="Shucon MedAI">
    </div>
    <div class="front-qr">
      <img src="qr.jpeg" alt="Scan QR">
    </div>
  </div>

  <div class="front-mid">
    <div class="front-name">Saksham Gupta</div>
    <div class="front-ceo">Chief Executive Officer</div>
    <div class="front-rule"></div>
    <div class="front-titles">
      Computer Scientist
    </div>
  </div>

  <div class="front-bottom">
    <div class="front-contact">
      <div class="contact-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        saksham@shucontech.in
      </div>
      <div class="contact-row">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.27h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.78a16 16 0 0 0 6.29 6.29l1.58-1.84a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.02z"/></svg>
        +91 87555 04999
      </div>
    </div>
    <div class="front-web"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>shucontech.in</div>
  </div>

</div>

<!-- ── BACK ── -->
<div class="label">Back</div>
<div class="card back">
  <div class="back-inner">
    <div class="back-logo">
      <img src="images/logo-bg.png" alt="Shucon MedAI">
    </div>
    <div class="back-rule"></div>
    <div class="back-tagline">AI Operating System for Hospitals</div>
    <div class="back-subtitle">Built with clinicians. Designed for hospital operations.</div>
    <div class="back-groups">
      <div class="back-pill">OPD • IPD</div>
      <div class="back-pill">Pharmacy</div>
      <div class="back-pill">Lab • Radiology</div>
      <div class="back-pill">Revenue Leakage</div>
      <div class="back-pill">AI Analytics</div>
      <div class="back-pill">Automation</div>
    </div>
  </div>
</div>

</body>
</html>
