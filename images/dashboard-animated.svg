    <g class="nav-item nav-5"><circle cx="20" cy="160" r="3" fill="#14a37f"/><text x="32" y="163" class="nav-text">Pathology Mgmt</text></g>
    <g class="nav-item nav-6"><circle cx="20" cy="176" r="3" fill="#14a37f"/><text x="32" y="179" class="nav-text">Lab Reports</text></g>

    <text x="14" y="198" class="nav-section">Radiology</text>
