    <g class="nav-item nav-8"><circle cx="20" cy="230" r="3" fill="#f5a623"/><text x="32" y="233" class="nav-text">Radiology Templates</text></g>

    <text x="14" y="252" class="nav-section">Doctor</text>
    <g class="nav-item nav-9"><circle cx="20" cy="268" r="3" fill="#7c3aed"/><text x="32" y="271" class="nav-text">Prescription Templates</text></g>
    <g class="nav-item nav-10"><circle cx="20" cy="284" r="3" fill="#7c3aed"/><text x="32" y="287" class="nav-text">Consultations</text></g>

    <text x="14" y="306" class="nav-section">IPD Management</text>
    <g class="nav-item nav-11"><circle cx="20" cy="322" r="3" fill="#1e63d8"/><text x="32" y="325" class="nav-text">IPD Dashboard</text></g>
    <g class="nav-item nav-12"><circle cx="20" cy="338" r="3" fill="#1e63d8"/><text x="32" y="341" class="nav-text">Patient Admission</text></g>
    <g class="nav-item nav-13"><circle cx="20" cy="354" r="3" fill="#1e63d8"/><text x="32" y="357" class="nav-text">Patient Management</text></g>
    <g class="nav-item nav-14"><circle cx="20" cy="370" r="3" fill="#1e63d8"/><text x="32" y="373" class="nav-text">Bed Management</text></g>

    <text x="14" y="392" class="nav-section">Inventory</text>
    <g class="nav-item nav-15"><circle cx="20" cy="408" r="3" fill="#14a37f"/><text x="32" y="411" class="nav-text">Stock &amp; Purchase</text></g>
    <g class="nav-item nav-16"><circle cx="20" cy="424" r="3" fill="#14a37f"/><text x="32" y="427" class="nav-text">Suppliers</text></g>

    <text x="14" y="446" class="nav-section">Admin</text>
    <g class="nav-item nav-17">
      <rect x="6" y="456" width="168" height="22" rx="6" fill="#fff5e6"/>
      <rect x="6" y="456" width="3" height="22" rx="2" fill="#f5a623"/>
      <circle cx="22" cy="467" r="3" fill="#f5a623"/>
      <text x="34" y="470" class="nav-text-active">Dashboard</text>
