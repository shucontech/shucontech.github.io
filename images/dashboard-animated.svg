<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid slice" role="img" aria-label="ShuconMedAI Hospital Management Dashboard">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafbfd"/>
      <stop offset="100%" stop-color="#eef2f9"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e63d8"/>
      <stop offset="100%" stop-color="#14a37f"/>
    </linearGradient>
    <linearGradient id="fillBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e63d8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1e63d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fillTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14a37f" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14a37f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fillGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leakRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e25c5c"/>
      <stop offset="100%" stop-color="#c23737"/>
    </linearGradient>
    <linearGradient id="leakAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f1a30" flood-opacity="0.06"/>
    </filter>
    <style>
      .card { fill: #ffffff; }
      .card-stroke { stroke: #e6ebf3; stroke-width: 1; fill: none; }
      .grid { stroke: #eef1f7; stroke-width: 1; }
      .axis-label { fill: #95a0bb; font: 500 9px "Plus Jakarta Sans", -apple-system, sans-serif; }
      .title { fill: #0f1a30; font: 600 14px "Plus Jakarta Sans", -apple-system, sans-serif; }
      .legend { fill: #5a6680; font: 500 10px "Plus Jakarta Sans", -apple-system, sans-serif; }
      .nav-text { fill: #5a6680; font: 500 10px "Plus Jakarta Sans", -apple-system, sans-serif; }
      .nav-text-active { fill: #d97706; font: 600 10px "Plus Jakarta Sans", -apple-system, sans-serif; }
      .nav-section { fill: #95a0bb; font: 600 8px "Plus Jakarta Sans", -apple-system, sans-serif; letter-spacing: 0.5px; text-transform: uppercase; }
      .leak-cat { fill: #5a6680; font: 500 9px "Plus Jakarta Sans", -apple-system, sans-serif; }
      .leak-val { fill: #0f1a30; font: 700 9px "Plus Jakarta Sans", -apple-system, sans-serif; }

      .line {
        fill: none;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
        animation: drawLine 5s cubic-bezier(0.65, 0, 0.35, 1) forwards infinite;
      }
      .line-1 { stroke: #1e63d8; animation-delay: 0s; }
      .line-2 { stroke: #14a37f; animation-delay: 0.3s; }
      .line-3 { stroke: #f5a623; animation-delay: 0.6s; }

      .area { opacity: 0; animation: fadeArea 5s ease-out forwards infinite; }
      .area-1 { animation-delay: 1.0s; }
      .area-2 { animation-delay: 1.3s; }
      .area-3 { animation-delay: 1.6s; }

      @keyframes drawLine {
        0%   { stroke-dashoffset: 1400; }
        45%  { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes fadeArea {
        0%, 20% { opacity: 0; }
        60%     { opacity: 1; }
        100%    { opacity: 1; }
      }

      .leak-bar { transform-origin: left center; animation: barGrow 5s cubic-bezier(0.65,0,0.35,1) forwards infinite; }
      .leak-1 { animation-delay: 0.10s; }
      .leak-2 { animation-delay: 0.25s; }
      .leak-3 { animation-delay: 0.40s; }
      .leak-4 { animation-delay: 0.55s; }
      .leak-5 { animation-delay: 0.70s; }
      @keyframes barGrow {
        0%   { transform: scaleX(0); }
        45%  { transform: scaleX(1); }
        100% { transform: scaleX(1); }
      }

      .pulse-dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.5; transform: scale(1.4); }
      }

      .nav-item { opacity: 0; animation: navIn 5s ease-out forwards infinite; }
      .nav-1  { animation-delay: 0.02s; }
      .nav-2  { animation-delay: 0.04s; }
      .nav-3  { animation-delay: 0.06s; }
      .nav-4  { animation-delay: 0.08s; }
      .nav-5  { animation-delay: 0.10s; }
      .nav-6  { animation-delay: 0.12s; }
      .nav-7  { animation-delay: 0.14s; }
      .nav-8  { animation-delay: 0.16s; }
      .nav-9  { animation-delay: 0.18s; }
      .nav-10 { animation-delay: 0.20s; }
      .nav-11 { animation-delay: 0.22s; }
      .nav-12 { animation-delay: 0.24s; }
      .nav-13 { animation-delay: 0.26s; }
      .nav-14 { animation-delay: 0.28s; }
      .nav-15 { animation-delay: 0.30s; }
      .nav-16 { animation-delay: 0.32s; }
      .nav-17 { animation-delay: 0.34s; }
      .nav-18 { animation-delay: 0.36s; }
      .nav-19 { animation-delay: 0.38s; }
      @keyframes navIn {
        0%   { opacity: 0; transform: translateX(-6px); }
        20%  { opacity: 1; transform: translateX(0); }
        100% { opacity: 1; transform: translateX(0); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#bgGrad)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="180" height="580" fill="#ffffff"/>
