    <g class="nav-item nav-17"><circle cx="20" cy="494" r="3" fill="#5a6680"/><text x="32" y="497" class="nav-text">Superuser Prefs</text></g>
    <g class="nav-item nav-18"><circle cx="20" cy="510" r="3" fill="#5a6680"/><text x="32" y="513" class="nav-text">Export Data</text></g>
    <g class="nav-item nav-19"><circle cx="20" cy="526" r="3" fill="#5a6680"/><text x="32" y="529" class="nav-text">My Account</text></g>
